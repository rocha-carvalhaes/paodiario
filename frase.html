<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frase Histórica - Pão Diário</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <header>
    <a href="index.html" style="text-decoration: none; color: inherit;">
      <h1>Pão Diário 🥖</h1>
    </a>
    <nav>
      <a href="sobre.html">Sobre</a>
      <a href="arquivo.html">Arquivo</a>
    </nav>
  </header>

  <main style="text-align: center; padding: 4rem 2rem;">
    <h2 id="aviso">📜 Esta é uma frase do histórico</h2>
    <p id="data" style="font-weight: 600; margin-top: 2rem;"></p>
    <h1 id="frase" style="font-size: 2rem; margin-top: 1rem;"></h1>
  </main>

  <script>
    // 1. Pega a data da URL
    const params = new URLSearchParams(window.location.search);
    const dataStr = params.get('data'); // formato esperado: YYYY-MM-DD

    // 2. Formata e separa
    if (!dataStr) {
      document.getElementById('frase').textContent = "Data inválida.";
    } else {
      const [ano, mes, dia] = dataStr.split('-');

      fetch('data/frases.json')
        .then(res => res.json())
        .then(json => {
          const frase = json?.[ano]?.[mes]?.[dia];
          if (frase) {
            document.getElementById('data').textContent = `🗓️ ${dataStr}`;
            document.getElementById('frase').textContent = frase;
          } else {
            document.getElementById('frase').textContent = "Frase não encontrada.";
          }
        })
        .catch(() => {
          document.getElementById('frase').textContent = "Erro ao carregar frase.";
        });
    }
  </script>
</body>
</html>
