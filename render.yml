services:
  - type: cron
    name: gerar-frase-diaria
    schedule: "0 7 * * *"  # Executa às 7h UTC (4h BRT)
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_URL
        sync: false
    runtime: python
    buildCommand: ""
    startCommand: python src/gerar_frase.py
